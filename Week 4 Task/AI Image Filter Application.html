<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Filter Interface</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }

    .navbar {
      background-color: #007BFF;
      padding: 10px 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: flex-end;
    }

    .navbar li {
      margin: 0 10px;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 4px;
      transition: background-color 0.3s;
    }

    .navbar a:hover {
      background-color: #0056b3;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background-color: #007BFF;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    section {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #333;
    }

    p {
      margin-bottom: 15px;
      color: #555;
    }

    input[type="file"], select, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      border: none;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
	footer {
      text-align: center;
      padding: 10px 0;
      background-color: #0056b3;
      color: white;
      bottom: 0;
      width: 100%;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
    }
    .response {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      background-color: #f9f9f9;
    }
    .delete-button {
      background-color: #d32f2f; 
      color: white;
    }
    .delete-button:hover {
      background-color: #c62828; 
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="#section1">Upload</a></li>
      <li><a href="#section2">Result</a></li>
    </ul>
  </nav>

  <header>
    <h1>AI Image Filter Application</h1>
  </header>

  <section id="section1">
    <h2>Upload Image</h2>
    <p>Select an image to apply AI-based filters:</p>
    <input type="file" id="imageUpload" accept="image/*">

    <label for="filterSelect">Choose a filter:</label>
    <select id="filterSelect">
      <option value="grayscale">Grayscale</option>
      <option value="sepia">Sepia</option>
      <option value="invert">Invert</option>
      <option value="brightness">Brightness</option>
      <option value="rotate">Rotate 90°</option>
      <option value="flip-horizontal">Flip Horizontally</option>
      <option value="flip-vertical">Flip Vertically</option>
    </select>

    <button id="applyFilter">Apply Filter</button>
  </section>

  <section id="section2">
    <h2>Filtered Image</h2>
    <p>Here’s the result after applying the filter:</p>
    <canvas id="filteredCanvas"></canvas>
  </section>

	 <footer>
    &copy; 2025 Survey Project
  </footer>

  <script>
    document.getElementById("applyFilter").addEventListener("click", () => {
      const input = document.getElementById("imageUpload");
      const canvas = document.getElementById("filteredCanvas");
      const context = canvas.getContext("2d");
      const selectedFilter = document.getElementById("filterSelect").value;

      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            if (["rotate", "flip-horizontal", "flip-vertical"].includes(selectedFilter)) {
              applyTransformFilter(context, img, selectedFilter);
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
              context.drawImage(img, 0, 0);
              applyFilter(context, img.width, img.height, selectedFilter);
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      } else {
        alert("Please upload an image first.");
      }
    });

    function applyFilter(context, width, height, filterType) {
      const imageData = context.getImageData(0, 0, width, height);
      const data = imageData.data;

      switch (filterType) {
        case "grayscale":
          for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            data[i] = avg;
            data[i + 1] = avg;
            data[i + 2] = avg;
          }
          break;

        case "sepia":
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            data[i] = 0.393 * r + 0.769 * g + 0.189 * b;
            data[i + 1] = 0.349 * r + 0.686 * g + 0.168 * b;
            data[i + 2] = 0.272 * r + 0.534 * g + 0.131 * b;
          }
          break;

        case "invert":
          for (let i = 0; i < data.length; i += 4) {
            data[i] = 255 - data[i];
            data[i + 1] = 255 - data[i + 1];
            data[i + 2] = 255 - data[i + 2];
          }
          break;

        case "brightness":
          const brightnessValue = 40;
          for (let i = 0; i < data.length; i += 4) {
            data[i] = Math.min(255, data[i] + brightnessValue);
            data[i + 1] = Math.min(255, data[i + 1] + brightnessValue);
            data[i + 2] = Math.min(255, data[i + 2] + brightnessValue);
          }
          break;

        default:
          console.error("Unknown filter type");
      }

      context.putImageData(imageData, 0, 0);
    }

    function applyTransformFilter(context, img, filterType) {
      const canvas = context.canvas;
      const tempCanvas = document.createElement("canvas");
      const tempContext = tempCanvas.getContext("2d");

      tempCanvas.width = img.width;
      tempCanvas.height = img.height;
      tempContext.drawImage(img, 0, 0);

      switch (filterType) {
        case "rotate":
          canvas.width = img.height;
          canvas.height = img.width;
          context.translate(img.height, 0);
          context.rotate(Math.PI / 2);
          context.drawImage(tempCanvas, 0, 0);
          context.resetTransform();
          break;

        case "flip-horizontal":
          canvas.width = img.width;
          canvas.height = img.height;
          context.scale(-1, 1);
          context.drawImage(tempCanvas, -img.width, 0);
          context.resetTransform();
          break;

        case "flip-vertical":
          canvas.width = img.width;
          canvas.height = img.height;
          context.scale(1, -1);
          context.drawImage(tempCanvas, 0, -img.height);
          context.resetTransform();
          break;

        default:
          console.error("Unknown transform filter type");
      }
    }
  </script>
</body>
</html>
