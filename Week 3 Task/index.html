<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Survey Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <div><strong>Survey</strong></div>
    <div>
      <a href="#section1">Section 1</a>
      <a href="#section2">Section 2</a>
    </div>
  </nav>

  <section id="section1">
    <h2>Section 1: Basic Information</h2>
    <form id="surveyForm" onsubmit="handleSubmit(event)">
      <label for="name">What is your name?</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <label for="age">How old are you?</label>
      <input type="number" id="age" name="age" min="1" placeholder="Enter your age" required>

      <label for="email">What is your email address?</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="question1">Do you like programming?</label>
      <select id="question1" name="question1">
        <option value="">-- Select an option --</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <div id="conditionalQuestion" class="hidden">
        <label for="favoriteLanguage">What is your favorite programming language?</label>
        <input type="text" id="favoriteLanguage" name="favoriteLanguage" placeholder="Enter your favorite language">

        <label for="experienceLevel">How would you rate your expertise in this language?</label>
        <select id="experienceLevel" name="experienceLevel">
          <option value="">-- Select an option --</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>

        <label for="codingFrequency">How often do you code?</label>
        <select id="codingFrequency" name="codingFrequency">
          <option value="">-- Select an option --</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="rarely">Rarely</option>
        </select>

        <label for="techInterest">What other technologies or fields interest you?</label>
        <textarea id="techInterest" name="techInterest" placeholder="Enter your interests" rows="4"></textarea>
      </div>

      <div id="feedbackQuestion" class="hidden">
        <label for="reason">Why don’t you like programming?</label>
        <textarea id="reason" name="reason" placeholder="Enter your reason here" rows="4"></textarea>

        <label for="alternativeInterest">What other fields or hobbies interest you?</label>
        <input type="text" id="alternativeInterest" name="alternativeInterest" placeholder="Enter your interests">

        <label for="challenges">What challenges have you faced in programming?</label>
        <textarea id="challenges" name="challenges" placeholder="Describe challenges" rows="4"></textarea>
      </div>

      <button type="submit">Submit</button>
    </form>
  </section>

  <section id="section2">
    <h2>Section 2: Review</h2>
    <p>Your responses will appear below once submitted:</p>
    <div id="review">
      <p>No responses yet.</p>
    </div>
  </section>

  <footer>
    &copy; 2025 Survey Project
  </footer>
  <script src="script.js"></script>
</body>
</html>
